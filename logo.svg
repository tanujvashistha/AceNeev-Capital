<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="anGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Monogram Emblem (A + N Foundation Icon) -->
  <g transform="translate(10, 10)">
    <!-- Outer Rounded Base Shield -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#0b1329" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2"/>
    
    <!-- Geometric 'A' Peak & 'N' Foundation -->
    <!-- Left Pillar -->
    <path d="M 28 72 L 28 36 L 42 22 L 42 72 Z" fill="url(#anGrad)" />
    <!-- Right Pillar -->
    <path d="M 58 72 L 58 28 L 72 42 L 72 72 Z" fill="url(#anGrad)" opacity="0.9"/>
    <!-- Diagonal Connecting Bridge ('N' Cross & 'A' Apex) -->
    <path d="M 38 34 L 64 68 L 52 74 L 28 40 Z" fill="url(#anGradLight)" filter="url(#subtleGlow)"/>
    <!-- Apex Diamond Core -->
    <polygon points="50,16 58,24 50,32 42,24" fill="#34d399" />
  </g>

  <!-- Typography: ACENEEV CAPITAL -->
  <g transform="translate(130, 26)">
    <!-- Primary Brand Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" letter-spacing="-0.5" fill="#ffffff">
      ACE<tspan fill="url(#anGradLight)">NEEV</tspan>
    </text>

    <!-- Sub Brand / Category Tag -->
    <text x="2" y="68" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="4.5" fill="#94a3b8">
      CAPITAL
    </text>

    <text x="135" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" letter-spacing="1.5" fill="#10b981">
      • WEALTH &amp; TRADING ADVISORY
    </text>
  </g>
</svg>
