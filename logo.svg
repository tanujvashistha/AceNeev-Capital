<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Monogram Emblem -->
  <g transform="translate(10, 10)">
    <!-- Architectural Arch Outline -->
    <path d="M 12 80 L 12 40 A 28 28 0 0 1 68 40 L 68 80" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 'A' Apex & Cross -->
    <path d="M 40 18 L 22 74" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 40 18 L 58 74" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="26" y1="56" x2="54" y2="56" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 'N' Foundation Diagonal (Emerald Accent) -->
    <line x1="26" y1="36" x2="54" y2="74" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- High-End Institutional Typography -->
  <g transform="translate(100, 24)">
    <text x="0" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="3" fill="#ffffff">
      ACENEEV
    </text>
    <text x="2" y="60" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" letter-spacing="6.5" fill="#94a3b8">
      CAPITAL
    </text>
    <circle cx="108" cy="56" r="2.5" fill="#10b981" />
    <text x="120" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" letter-spacing="1.5" fill="#10b981">
      WEALTH ADVISORY
    </text>
  </g>
</svg>
