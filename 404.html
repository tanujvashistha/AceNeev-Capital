<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AceNeev Capital</title>
  <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#080d1a] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-slate-900">
  
  <div class="glass-card rounded-3xl p-8 sm:p-12 max-w-lg w-full text-center space-y-6 border border-slate-700/80 shadow-2xl relative">
    
    <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 mx-auto">
      <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>

    <div class="space-y-2">
      <div class="text-xs font-mono font-bold text-emerald-400 uppercase tracking-widest">Error 404</div>
      <h1 class="text-3xl sm:text-4xl font-extrabold font-display text-white">Page Not Found</h1>
      <p class="text-slate-400 text-sm leading-relaxed">
        The financial advisory page or link you are looking for has moved or does not exist.
      </p>
    </div>

    <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="index.html" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold text-xs shadow-lg hover:opacity-95 transition flex items-center justify-center space-x-2">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Return to Homepage</span>
      </a>

      <a href="mailto:aceneevcapital@gmail.com" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs transition flex items-center justify-center space-x-2">
        <i data-lucide="mail" class="w-4 h-4 text-emerald-400"></i>
        <span>Mail Us</span>
      </a>
    </div>

    <div class="pt-4 border-t border-slate-800 text-xs font-mono text-slate-500">
      AceNeev Capital • aceneevcapital@gmail.com
    </div>

  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
